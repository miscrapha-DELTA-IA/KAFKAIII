name: Expand preserved KAFKA III source archives

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/expand-source-archives.yml"
      - "README.md"
      - "v*/**"
      - "paper/**"
      - "comparison/**"
      - "limits/**"
      - "protocols/**"
      - "provenance/**"
      - "archive/**/*.zip"
      - "archive/**/README.md"
      - "scripts/expand_source_archives.py"
      - "v0.4/*.zip"
      - "v0.5C/*.zip"
      - "v1.7/*.zip"
      - "v1.8A/*.zip"
      - "v1.9D/*.zip"
      - "v1.9F/*.zip"
      - "archive/source_archives/*.zip"
      - "archive/recovery/*.zip"

permissions:
  contents: write

jobs:
  expand-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Safely expand preserved archives and build SHA-256 manifest
        run: python scripts/expand_source_archives.py

      - name: Commit extracted source files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Expand preserved KAFKA III source archives"
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
